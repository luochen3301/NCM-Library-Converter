name: CI

on:
  push:
    branches:
      - master
      - codex/**
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run service tests
        run: python -m unittest discover -s tests

      - name: Syntax check
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          files = [
              "gui.py",
              "web.py",
              "ncmdump/core.py",
              "ncmdump/__init__.py",
              "ncmdump/models.py",
              "ncmdump/i18n.py",
              "ncmdump/library_db.py",
              "ncmdump/library_scanner.py",
              "ncmdump/conversion_queue.py",
          ]
          for name in files:
              source = Path(name).read_text(encoding="utf-8")
              compile(source, name, "exec")
          print("syntax ok")
          '@ | python -

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build container image
        run: docker build -t ncmdump:ci .
